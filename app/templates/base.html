<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Airbnb Rate Optimizer{% endblock %}</title>
<style>
  :root {
    --bg: #fbfbfa; --fg: #1a1a19; --muted: #6b6b68; --line: #e4e3e0;
    --accent: #b8452f; --ok: #2c6e49; --warn: #9a6700; --card: #fff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  header {
    background: var(--card); border-bottom: 1px solid var(--line);
    padding: 14px 24px; display: flex; align-items: center; gap: 16px;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  header a { color: var(--muted); text-decoration: none; font-size: 14px; }
  header a:hover { color: var(--fg); }
  main { max-width: 1100px; margin: 0 auto; padding: 28px 24px 80px; }
  h2 { font-size: 19px; margin: 32px 0 12px; letter-spacing: -0.01em; }
  h3 { font-size: 15px; margin: 24px 0 8px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 18px 20px; margin-bottom: 16px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  th { font-weight: 600; color: var(--muted); font-size: 12px;
       text-transform: uppercase; letter-spacing: 0.04em; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.ours { background: #fff8f2; font-weight: 600; }
  .pill {
    display: inline-block; padding: 2px 9px; border-radius: 99px;
    font-size: 12px; font-weight: 600;
  }
  .pill.ok { background: #e6f2ea; color: var(--ok); }
  .pill.warn { background: #fdf3dc; color: var(--warn); }
  .pill.err { background: #fbeae7; color: var(--accent); }
  .muted { color: var(--muted); }
  .big { font-size: 30px; font-weight: 680; letter-spacing: -0.02em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 18px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px;
          text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; }
  input, select, textarea {
    width: 100%; padding: 7px 9px; border: 1px solid var(--line);
    border-radius: 6px; font: inherit; font-size: 14px; background: #fff;
  }
  textarea { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  .field { margin-bottom: 14px; }
  button {
    background: var(--fg); color: #fff; border: 0; border-radius: 7px;
    padding: 8px 15px; font: inherit; font-weight: 560; cursor: pointer;
  }
  button:hover { opacity: 0.88; }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  button.danger { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  .row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  a { color: var(--accent); }
  details summary { cursor: pointer; font-weight: 600; margin-bottom: 10px; }
  .banner { background: #eef4fb; border: 1px solid #cfe0f2; color: #24466b;
            padding: 10px 14px; border-radius: 8px; margin-bottom: 18px; font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>Airbnb Rate Optimizer</h1>
  <a href="/">Windows</a>
  <a href="/healthz">Health</a>
</header>
<main>
{% block body %}{% endblock %}
</main>
</body>
</html>
